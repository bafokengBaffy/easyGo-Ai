[metadata]
name = easygo-ai-services
version = 0.1.0
description = AI and ML services for the easyGo platform
author = easyGo Platform

[options]
packages = find:
package_dir =
    = src
include_package_data = true
install_requires =
    fastapi==0.115.6
    uvicorn[standard]==0.34.0
    pydantic==2.10.4
    python-dotenv==1.0.1
    numpy==1.26.4
    pandas==2.2.3
    scikit-learn==1.6.1
    xgboost==2.1.3
    lightgbm==4.5.0
    catboost==1.2.5
    tensorflow==2.18.0
    torch==2.5.1
    transformers==4.48.0
    mlflow==2.20.2
    optuna==4.2.1
    hyperopt==0.2.7
    dask==2025.1.0
    polars==1.20.0
    great-expectations==1.4.3
    asyncpg==0.30.0
    redis==5.2.1
    kafka-python==2.0.2
    aio-pika==9.4.4
    motor==3.6.0
    prometheus-client==0.21.0
    structlog==25.1.0
    sentry-sdk==2.20.0
    feast==0.38.0
    shap==0.46.0
    lime==0.2.0.1
    eli5==0.13.0
    joblib==1.4.2
    tqdm==4.67.1
    requests==2.32.3
    httpx==0.28.1
    pyyaml==6.0.2

[flake8]
max-line-length = 120
ignore = E203, W503

[tool:pytest]
minversion = 7.0
addopts = --strict-markers
testpaths = tests
